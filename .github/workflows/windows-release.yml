name: Windows release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable version tag, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      VITE_LAN_COMPONENTS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'
          cache: npm
      - name: Validate stable version tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw 'Expected stable tag vx.y.z' }
          $tagCommit = git rev-parse "refs/tags/$env:RELEASE_TAG^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Release tag does not exist' }
          if ($tagCommit -ne (git rev-parse HEAD)) { throw 'Checkout does not match release tag' }
          "RELEASE_VERSION=$($env:RELEASE_TAG.Substring(1))" >> $env:GITHUB_ENV
      - name: Exclude unfinished career mode
        run: node scripts/check-release-scope.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install lossless image encoder
        run: python -m pip install "Pillow==12.1.0"
      - run: npm ci
      - run: npm run lint
      - name: Check network diagnostics and heartbeat
        run: npm run network:check
      - name: Check shared native capture and viewer projection
        run: node scripts/check-native-capture.mjs
      # Keep failing gates visible and retain a draft for explicit release review.
      # Only passing gates may automatically replace the stable update release.
      - name: Check Steam transport release gates
        id: steam_checks
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          npm run steam:check
      - run: npm run package:windows -- --version $env:RELEASE_VERSION
      - name: Verify built release excludes career mode
        run: node scripts/check-release-scope.mjs
      - run: npm run package:steam -- --skip-build --version $env:RELEASE_VERSION
      - run: npm run release:manifest -- --version $env:RELEASE_VERSION
      - name: Check lightweight desktop updater
        run: node --test scripts/check-desktop-content.mjs
      - run: npm run package:electron -- --skip-build --version $env:RELEASE_VERSION
      - name: Publish checked release or retain draft for review
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_NEEDS_REVIEW: ${{ steps.steam_checks.outcome != 'success' }}
        run: |
          if ($env:GH_REPO -cne 'Aca233/starsector-web') { throw 'Configure the updater repository before publishing from a fork' }
          $manifestPath = Join-Path $PWD 'artifacts/releases/windows-updates.json'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $files = @($manifestPath)
          foreach ($variant in @('multiplayer', 'steam')) {
            $files += Join-Path $PWD "artifacts/releases/$($manifest.packages.$variant.asset)"
          }
          $desktop = Get-Content -LiteralPath (Join-Path $PWD 'artifacts/electron/latest-build.json') -Raw | ConvertFrom-Json
          if ($desktop.version -ne $env:RELEASE_VERSION) { throw 'Electron version does not match release' }
          foreach ($name in @("Starsector-Web-Desktop-Setup-${env:RELEASE_VERSION}-x64.exe", "Starsector-Web-Desktop-Setup-${env:RELEASE_VERSION}-x64.exe.blockmap", "Starsector-Web-Desktop-${env:RELEASE_VERSION}-x64.zip", 'latest.yml', 'desktop-content.json', "Starsector-Web-Content-${env:RELEASE_VERSION}-x64.bin")) {
            $asset = Join-Path $desktop.output $name
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) { throw "Missing Electron artifact: $name" }
            $files += $asset
          }
          # Keep incomplete uploads out of /releases/latest. Never overwrite an existing version.
          $needsReview = $env:RELEASE_NEEDS_REVIEW -eq 'true'
          $releaseOptions = @()
          $notes = Join-Path $PWD "docs/releases/$($env:RELEASE_TAG).md"
          if (Test-Path -LiteralPath $notes -PathType Leaf) { $releaseOptions += @('--notes-file', $notes) }
          gh release create $env:RELEASE_TAG @files @releaseOptions --verify-tag --draft --generate-notes --title "Starsector Web $env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Release creation/upload failed; inspect any draft before retrying' }
          if ($needsReview) {
            Write-Warning 'Steam gates did not all pass. Assets remain in a non-public draft for explicit review; no prerelease or stable update was published.'
          } else {
            gh release edit $env:RELEASE_TAG --draft=false --prerelease=false --latest
            if ($LASTEXITCODE -ne 0) { throw 'Publishing draft release failed' }
          }
