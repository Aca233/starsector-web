name: Windows release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable version tag, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'
          cache: npm
      - name: Validate stable version tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw 'Expected stable tag vx.y.z' }
          $tagCommit = git rev-parse "refs/tags/$env:RELEASE_TAG^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Release tag does not exist' }
          if ($tagCommit -ne (git rev-parse HEAD)) { throw 'Checkout does not match release tag' }
          "RELEASE_VERSION=$($env:RELEASE_TAG.Substring(1))" >> $env:GITHUB_ENV
      - run: npm ci
      - run: npm run lint
      # Keep failing network gates visible without denying users a preview build.
      # Only a passing check run may replace the stable auto-update release.
      - name: Check Steam transport release gates
        id: steam_checks
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          npm run steam:check
      - run: npm run package:windows -- --version $env:RELEASE_VERSION
      - run: npm run package:steam -- --skip-build --version $env:RELEASE_VERSION
      - run: npm run release:manifest -- --version $env:RELEASE_VERSION
      - run: npm run package:electron -- --skip-build --version $env:RELEASE_VERSION
      - name: Publish complete release with checked stability
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PRERELEASE: ${{ steps.steam_checks.outcome != 'success' }}
        run: |
          if ($env:GH_REPO -cne 'Aca233/starsector-web') { throw 'Configure the updater repository before publishing from a fork' }
          $manifestPath = Join-Path $PWD 'artifacts/releases/windows-updates.json'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $files = @($manifestPath)
          foreach ($variant in @('multiplayer', 'steam')) {
            $files += Join-Path $PWD "artifacts/releases/$($manifest.packages.$variant.asset)"
          }
          $desktop = Get-Content -LiteralPath (Join-Path $PWD 'artifacts/electron/latest-build.json') -Raw | ConvertFrom-Json
          if ($desktop.version -ne $env:RELEASE_VERSION) { throw 'Electron version does not match release' }
          foreach ($name in @("Starsector-Web-Desktop-Setup-${env:RELEASE_VERSION}-x64.exe", "Starsector-Web-Desktop-Setup-${env:RELEASE_VERSION}-x64.exe.blockmap", "Starsector-Web-Desktop-${env:RELEASE_VERSION}-x64.zip", 'latest.yml')) {
            $asset = Join-Path $desktop.output $name
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) { throw "Missing Electron artifact: $name" }
            $files += $asset
          }
          # Keep incomplete uploads out of /releases/latest. Never overwrite an existing version.
          $preview = $env:RELEASE_PRERELEASE -eq 'true'
          $releaseOptions = @()
          if ($preview) {
            $releaseOptions += @('--prerelease', '--notes', 'Preview build: Steam transport release gates did not all pass. This is not the latest stable release and is excluded from stable automatic updates. See the workflow Steam check log for known failures; real multi-account Steam validation remains outstanding.')
          }
          gh release create $env:RELEASE_TAG @files @releaseOptions --verify-tag --draft --generate-notes --title "Starsector Web $env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Release creation/upload failed; inspect any draft before retrying' }
          if ($preview) {
            gh release edit $env:RELEASE_TAG --draft=false --prerelease --latest=false
          } else {
            gh release edit $env:RELEASE_TAG --draft=false --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'Publishing draft release failed' }
